name: Jan Aawaz Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    name: Backend PyTest Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest ruff pyflakes

      - name: Lint for undefined names with ruff and pyflakes
        run: |
          ruff check --select F821 backend
          python -c "import subprocess, sys; res = subprocess.run([sys.executable, '-m', 'pyflakes', 'backend'], capture_output=True, text=True); errs = [l for l in (res.stdout + res.stderr).splitlines() if 'undefined name' in l]; sys.exit(1 if errs else 0)"

      - name: Run pytest test suite
        run: |
          cd backend
          python -m pytest tests -v
        env:
          DATABASE_URL: sqlite+aiosqlite:///./test_ci.db
          DEV_MODE: "true"
          JWT_SECRET: "ci_test_jwt_secret_key_2026"
          AUTHORITY_EMAILS: "commissioner@delhi.gov.in,admin@janaawaz.in"
          SLA_TIME_SCALE: "1"

  frontend-build:
    name: Frontend Vite Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Run production build
        run: |
          cd frontend
          npm run build
