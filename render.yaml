services:
  - type: web
    name: jan-aawaz-backend
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEV_MODE
        value: "false"
      - key: CORS_ORIGINS
        value: "https://*.vercel.app"
